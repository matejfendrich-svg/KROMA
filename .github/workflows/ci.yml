name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Release DMG + test spustitelnosti (scripts/test-release.sh)
        run: scripts/test-release.sh
